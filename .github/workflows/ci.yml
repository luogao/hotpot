name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (release)
        run: swift build -c release
      - name: E2E self-check
        run: .build/debug/HotPot --e2e
